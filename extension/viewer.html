<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>baited · Chat's secret</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="./runtime-config.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-surface="viewer">
    <!-- THESIS: One dealt card beside the stream. OWN-WORLD: The landing's
    charcoal card stock, violet edge, yellow word and joined bait them. signature.
    STORY: Read the word, avoid the forbidden clues, then steer the conversation.
    FIRST VIEWPORT: Compact brand rail above one card. The word owns the middle;
    clues and clock sit immediately below. Instructions stay outside the card.
    FORM: The approved playing-card composition, fitted to Twitch's 320 px panel.
    State changes carry meaning; the card holds still while chat plays. -->
    <main class="panel" aria-label="baited viewer panel">
      <header class="masthead">
        <h1 class="wordmark">baited<span class="brand-stop" aria-hidden="true">.</span></h1>
        <span class="round-index" id="round-index">Chat's secret</span>
      </header>
      <div class="connection" id="connection" role="status" aria-live="polite">
        <span id="connection-copy">Connecting to Twitch…</span>
        <button class="retry" id="retry" type="button" hidden>Try again</button>
      </div>
      <section class="secret-card" id="card" aria-labelledby="card-title" data-state="waiting">
        <div class="card-topline">
          <p class="card-kicker" id="card-kicker">Next round</p>
          <span class="phase-label" id="phase-label">Waiting</span>
        </div>
        <div class="card-center">
          <img class="bomb" id="bomb" src="./assets/bait-bomb.png" alt="" width="80" height="80" />
          <h2 class="target" id="card-title">The word is coming.</h2>
          <p class="card-detail" id="card-detail">
            It appears here when the streamer starts a round.
          </p>
        </div>
        <section class="forbidden" id="forbidden" aria-labelledby="forbidden-heading" hidden>
          <h3 id="forbidden-heading">Off limits</h3>
          <ul id="forbidden-list"></ul>
        </section>
        <div class="clock" id="clock" hidden>
          <div class="clock-labels">
            <span id="clock-caption">Time left</span>
            <span id="clock-value" class="clock-value" aria-label="Time left">0:00</span>
          </div>
          <progress
            id="clock-progress"
            max="100"
            value="100"
            aria-label="Round time remaining"
          ></progress>
        </div>
        <div class="card-baseline">
          <span class="card-tagline"><b>bait</b> them.</span
          ><span class="card-stamp" id="card-stamp">Keep it in chat</span>
        </div>
      </section>
      <footer class="panel-footer">
        <p id="play-instruction">Write a hint in chat. Keep the secret word to yourself.</p>
        <p class="skip-note" id="skip-note"><code>!skip</code> votes for another word.</p>
      </footer>
      <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
