<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>baited · Chat's secret</title>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="./runtime-config.js"></script>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-surface="viewer">
    <!-- THESIS: One dealt card beside the stream. OWN-WORLD: The landing's
    selected card: a Glass face, the word in its item's ink, the Mosaic back
    and the original BAITED signature, on the violet table.
    STORY: Read the word, avoid the forbidden clues, then steer the conversation.
    FIRST VIEWPORT: Compact brand rail above one card. The word owns the middle;
    clues, the example question and clock sit immediately below.
    FORM: The landing's card composition, fitted to Twitch's 318 px panel.
    State changes carry meaning; the card holds still while chat plays. -->
    <main class="panel" aria-label="baited viewer panel">
      <header class="masthead">
        <h1 class="wordmark" aria-label="BAITED">
          <span class="baited-glyph" aria-hidden="true"></span>
        </h1>
        <span class="round-index" id="round-index">Chat's secret</span>
      </header>
      <div class="connection" id="connection" role="status" aria-live="polite">
        <span id="connection-copy">Connecting to Twitch…</span>
        <button class="retry" id="retry" type="button" hidden>Try again</button>
      </div>
      <section class="secret-card" id="card" aria-labelledby="card-title" data-state="waiting">
        <!-- The view box is the full-size card in CSS pixels, so the glass scales with the panel. -->
        <svg class="glass-field" viewBox="0 0 300 420" preserveAspectRatio="xMidYMin slice" aria-hidden="true" focusable="false">
          <path id="field-rules" fill="none" stroke="#fffdf7" stroke-opacity="0.22" stroke-width="1.5" />
        </svg>
        <div class="card-topline">
          <p class="card-kicker" id="card-kicker">Next round</p>
          <span class="phase-label" id="phase-label">Waiting</span>
          <span class="difficulty" id="difficulty" role="img" hidden></span>
        </div>
        <div class="card-center">
          <div class="waiting-card" id="card-back" aria-hidden="true">
            <span class="waiting-mark baited-glyph"></span>
          </div>
          <span class="art-square">
            <span class="glass-lens" aria-hidden="true">
              <svg class="glass-bend" viewBox="0 0 267.2 249.6" preserveAspectRatio="xMidYMid slice" focusable="false">
                <defs>
                  <linearGradient id="glass-light" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#8c43f9" />
                    <stop offset="1" stop-color="#241050" />
                  </linearGradient>
                  <filter
                    id="glass-bend"
                    filterUnits="userSpaceOnUse"
                    primitiveUnits="userSpaceOnUse"
                    x="0"
                    y="0"
                    width="100%"
                    height="100%"
                    color-interpolation-filters="sRGB"
                  >
                    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.017" numOctaves="1" seed="5" result="n" />
                    <feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="A" yChannelSelector="A" result="bent" />
                    <feGaussianBlur in="bent" stdDeviation="0.9" result="frost" />
                    <feColorMatrix in="frost" type="saturate" values="1.8" />
                  </filter>
                </defs>
                <g filter="url(#glass-bend)">
                  <rect width="100%" height="100%" fill="url(#glass-light)" />
                  <path id="lens-rules" fill="none" stroke="#fffdf7" stroke-opacity="0.3" stroke-width="1.5" />
                </g>
              </svg>
            </span>
            <img class="word-art" id="word-art" alt="" width="132" height="132" hidden />
          </span>
        </div>
        <div class="card-plate">
          <h2 class="target" id="card-title">The word is coming.</h2>
          <p class="card-detail" id="card-detail">
            It appears here when the streamer starts a round.
          </p>
          <section class="forbidden" id="forbidden" aria-labelledby="forbidden-heading" hidden>
            <h3 id="forbidden-heading">Keep out of chat</h3>
            <ul id="forbidden-list"></ul>
          </section>
          <p class="card-question" id="card-question" hidden></p>
          <div class="clock" id="clock" hidden>
            <div class="clock-labels">
              <span class="clock-mark baited-glyph" aria-hidden="true"></span>
              <span id="clock-caption">Time left</span>
              <span id="clock-value" class="clock-value" role="timer" aria-live="off" aria-label="Time left">0:00</span>
            </div>
            <progress
              id="clock-progress"
              max="100"
              value="100"
              aria-label="Round time remaining"
            ></progress>
          </div>
          <div class="card-baseline">
            <span class="baited-glyph" aria-hidden="true"></span>
            <span class="card-stamp" id="card-stamp">Only chat will know</span>
          </div>
        </div>
      </section>
      <footer class="panel-footer">
        <p id="play-instruction">Nudge the conversation.</p>
        <p class="skip-note" id="skip-note"><code>!skip</code> votes for a new word.</p>
      </footer>
      <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
